<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando TikTok...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px 0; font-weight: 800; }
    p { font-size: 13px; color: #64748b; margin: 0; }
  </style>
  <script>
    window.onload = function() {
      var search = window.location.search;
      // Redirigir a nuestro servidor local HTTPS
      window.location.href = 'https://localhost:4443/api/tiktok/callback' + search;
    };
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Conectando con el Publicador...</h2>
    <p>Redirigiendo de forma segura a tu servidor local.</p>
  </div>
</body>
</html>
